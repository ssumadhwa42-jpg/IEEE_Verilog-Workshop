# Tiny Tapeout project information
project:
  title:        "4-bit ALU"
  author:       "Sumadhwa"
  discord:      ""
  description:  "A Verilog-based 4-bit Arithmetic Logic Unit supporting addition, subtraction, AND, OR, XOR, NOT, left shift, and right shift operations."
  language:     "Verilog"
  clock_hz:     5000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module: "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "B0"
  ui[5]: "B1"
  ui[6]: "B2"
  ui[7]: "B3"

  # Outputs
  uo[0]: "Result bit 0"
  uo[1]: "Result bit 1"
  uo[2]: "Result bit 2"
  uo[3]: "Result bit 3"
  uo[4]: "Carry/Borrow"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # Bidirectional pins
  uio[0]: "Operation bit 0"
  uio[1]: "Operation bit 1"
  uio[2]: "Operation bit 2"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
